services:
  - type: web
    name: postpulse-backend
    env: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: USE_MOCK_META
        value: "true"
      - key: DATABASE_NAME
        value: postpulse_db
